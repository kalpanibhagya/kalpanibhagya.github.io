<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalpani Ranasinghe - Digital CV</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="two-column">
      <div id="experience"></div>
      <div id="education"></div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Kalpani Ranasinghe — Digital CV
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("year").textContent = new Date().getFullYear();

      // First load header
      fetch("sections/header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("header").innerHTML = html;

          // Now summary div exists → load summary
          return fetch("sections/summary.html");
        })
        .then(res => res.text())
        .then(summaryHtml => {
          const summaryDiv = document.getElementById("summary");
          if (summaryDiv) {
            summaryDiv.innerHTML = summaryHtml;
          } else {
            console.error("Summary div not found after header load.");
          }
        })
        .catch(err => console.error("Error loading header or summary:", err));

      // Load remaining sections
      ["experience", "education"].forEach(section => {
        fetch(`sections/${section}.html`)
          .then(res => res.text())
          .then(html => {
            document.getElementById(section).innerHTML = html;
          });
      });

    });
  </script>

</body>
</html>
